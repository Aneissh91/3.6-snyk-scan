name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Package your Lambda handler into a zip
      - name: Package Lambda
        run: |
          cd 3.6-SNYK-SCAN
          zip lambda.zip index.js

      # Verify the zip contents
      - name: Verify Lambda Zip
        run: |
          cd 3.6-SNYK-SCAN
          ls -l
          unzip -l lambda.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd 3.6-SNYK-SCAN
          terraform init

      - name: Terraform Validate
        run: |
          cd 3.6-SNYK-SCAN
          terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd 3.6-SNYK-SCAN
          terraform plan

  snyk-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Snyk
        run: npm install -g snyk

      # IaC scan for Terraform
      - name: Run Snyk IaC Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          cd 3.6-SNYK-SCAN
          snyk iac test --file=main.tf
